  // 读取 ?app= 参数，把指定应用的卡片置顶（正式版/测试版/ArkUI-X 版 Tab 均生效）
  // 匹配优先级：id 精确 > alias 精确（拼音缩写，如 ?app=xhgjh）> 名称模糊匹配（如 ?app=轨交）
  // 逗号分隔可置顶多个
  function getAppParamKeys() {
    var param = '';
    try {
      param = (new URLSearchParams(window.location.search).get('app') || '').trim();
    } catch (e) {}
    if (!param) return [];
    var keys = param.toLowerCase().split(/[,\s]+/);
    var validKeys = [];
    for (var ki = 0; ki < keys.length; ki++) {
      if (keys[ki]) validKeys.push(keys[ki]);
    }
    return validKeys;
  }

  function matchAppRank(item, keys) {
    var appId = String(item.id || '').toLowerCase();
    var appName = String(item.name || '').toLowerCase();
    var aliases = item.alias || [];
    for (var j = 0; j < keys.length; j++) {
      var key = keys[j];
      if (appId && appId === key) return j;
      for (var a = 0; a < aliases.length; a++) {
        if (String(aliases[a]).toLowerCase() === key) return j;
      }
    }
    for (var k = 0; k < keys.length; k++) {
      if (keys[k].length >= 2 && appName.indexOf(keys[k]) !== -1) return k;
    }
    return -1;
  }

  function pinApps(list, keys) {
    if (!keys.length) return list;
    var pinned = [];
    var rest = [];
    for (var i = 0; i < list.length; i++) {
      var rank = matchAppRank(list[i], keys);
      if (rank >= 0) pinned.push({ rank: rank, order: i, app: list[i] });
      else rest.push(list[i]);
    }
    if (!pinned.length) return list;
    pinned.sort(function(a, b) { return a.rank - b.rank || a.order - b.order; });
    var out = [];
    for (var p = 0; p < pinned.length; p++) out.push(pinned[p].app);
    return out.concat(rest);
  }

  function getOrderedApps() {
    return pinApps(APPS, getAppParamKeys());
  }

  function renderApps(type) {
    var list = getOrderedApps();
    var container = document.getElementById(type === 'release' ? 'tabRelease' : 'tabBeta');
    var isDark = document.documentElement.getAttribute('data-theme') === 'dark';
    var badgeSrc = isDark ? 'images/baji1.png' : 'images/baji2.png';
    var hasContent = false;
    var html = '';

    for (var i = 0; i < list.length; i++) {
      var app = list[i];
      var links = type === 'release' ? app.release : app.beta;
      if (!links || links.length === 0) continue;
      hasContent = true;

      html += '<div class="app-card">';
      html += '<div class="app-header">';
      html += '<img class="app-icon" src="' + app.icon + '" alt="' + app.name + '">';
      html += '<div class="app-info">';
      html += '<div class="app-name">' + app.name + '</div>';
      html += '<div class="app-desc">' + app.desc + '</div>';
      html += '</div></div>';
      html += '<div class="app-links">';

      for (var j = 0; j < links.length; j++) {
        var link = links[j];
        var pIcon = link.platform.indexOf('AppTest') !== -1 ? 'images/AppTest.png' : 'images/AppGallery.png';
        html += '<div class="app-link-item">';
        html += '<div class="app-link-label"><img src="' + pIcon + '" alt="">获取：' + link.platform + '（需HarmonyOS ' + (app.minHarmony || '6.1') + '及以上系统版本）</div>';
        if (type === 'release') {
          html += '<a href="' + link.url + '" target="_blank" rel="noopener noreferrer">';
          html += '<img class="download-badge" src="' + badgeSrc + '" alt="' + link.platform + '">';
          html += '</a>';
        } else {
          html += '<a class="platform-btn" href="' + link.url + '" target="_blank" rel="noopener noreferrer">';
          html += '<img src="' + pIcon + '" alt="">前往测试</a>';
        }
        html += '</div>';
      }

      html += '</div></div>';
    }

    if (!hasContent) {
      html = '<div class="empty-tip">暂无' + (type === 'release' ? '正式版' : '测试版') + '应用</div>';
    }

    container.innerHTML = html;
  }

  var ANDROID_ICON = '<svg viewBox="0 0 24 24" width="16" height="16" fill="#3DDC84"><path d="M6 18c0 .55.45 1 1 1h1v3.5c0 .83.67 1.5 1.5 1.5s1.5-.67 1.5-1.5V19h2v3.5c0 .83.67 1.5 1.5 1.5s1.5-.67 1.5-1.5V19h1c.55 0 1-.45 1-1V8H6v10zM3.5 8C2.67 8 2 8.67 2 9.5v7c0 .83.67 1.5 1.5 1.5S5 17.33 5 16.5v-7C5 8.67 4.33 8 3.5 8zm17 0c-.83 0-1.5.67-1.5 1.5v7c0 .83.67 1.5 1.5 1.5s1.5-.67 1.5-1.5v-7c0-.83-.67-1.5-1.5-1.5zm-4.97-5.84l1.3-1.3c.2-.2.2-.51 0-.71-.2-.2-.51-.2-.71 0l-1.48 1.48C13.85 1.23 12.95 1 12 1c-.96 0-1.86.23-2.66.63L7.85.15c-.2-.2-.51-.2-.71 0-.2.2-.2.51 0 .71l1.31 1.31C6.97 3.26 6 5.01 6 7h12c0-1.99-.97-3.75-2.47-4.84zM10 5H9V4h1v1zm5 0h-1V4h1v1z"/></svg>';

  function escHtml(s) {
    return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }

  function cmpVersion(a, b) {
    var pa = String(a).split('.');
    var pb = String(b).split('.');
    var len = Math.max(pa.length, pb.length);
    for (var i = 0; i < len; i++) {
      var na = parseInt(pa[i], 10) || 0;
      var nb = parseInt(pb[i], 10) || 0;
      if (na !== nb) return na > nb ? 1 : -1;
    }
    return 0;
  }

  function renderNotes(notes) {
    if (typeof notes === 'string') notes = notes.split(/\r?\n/);
    var html = '';
    var inList = false;
    var inItem = false;
    for (var i = 0; i < notes.length; i++) {
      var line = String(notes[i] == null ? '' : notes[i]).trim();
      if (!line) continue;
      if (line.charAt(0) === '【') {
        if (inList) { html += '</ul>'; inList = false; }
        html += '<div class="notes-section">' + escHtml(line) + '</div>';
        inItem = false;
      } else if (line.charAt(0) === '-') {
        if (!inList) { html += '<ul class="update-notes">'; inList = true; }
        html += '<li>' + escHtml(line.replace(/^-+\s*/, '')) + '</li>';
        inItem = true;
      } else if (line.charAt(0) === '>') {
        var sub = '<div class="note-sub">' + escHtml(line.replace(/^>+\s*/, '')) + '</div>';
        if (inList && inItem) {
          html = html.replace(/<\/li>$/, sub + '</li>');
        } else {
          if (inList) { html += '</ul>'; inList = false; }
          html += sub;
        }
      } else {
        if (inList) { html += '</ul>'; inList = false; }
        html += '<p class="note-para">' + escHtml(line) + '</p>';
        inItem = false;
      }
    }
    if (inList) html += '</ul>';
    return html;
  }

  var IOS_ICON = '<svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor"><path d="M16.365 1.43c0 1.14-.473 2.29-1.28 3.11-.86.87-2.19 1.54-3.24 1.45-.13-1.09.44-2.24 1.24-3.06.87-.87 2.3-1.5 3.28-1.5zM20.94 17.05c-.57 1.31-.84 1.9-1.58 3.06-1.02 1.61-2.46 3.62-4.25 3.63-1.59.02-2-1.03-4.16-1.02-2.16.01-2.61 1.04-4.2 1.03-1.79-.02-3.16-1.83-4.18-3.44C.02 16.75-.3 12.24 1.34 9.8c1.16-1.73 2.99-2.75 4.71-2.75 1.75 0 2.85 1.03 4.3 1.03 1.4 0 2.26-1.03 4.28-1.03 1.53 0 3.15.83 4.3 2.27-3.78 2.07-3.17 7.47 2.01 7.73z"/></svg>';

  // ArkUI-X 版 Tab 卡片定义，顺序受 ?app= 参数控制
  // 组级关键词：android / ios / history / arkuix 各种拼写效果一致，均置顶整组三张卡（正统入口为 <appid>arkuix）
  // 以后新增 ArkUI-X 应用按 <appid>android / <appid>ios / <appid>history / <appid>arkuix 命名，加入该应用的组级关键词表
  var ARKUIX_GROUP_ALIAS = ['metro', 'gjcxzn', 'metroandroid', 'gjcxznandroid', 'metroios', 'gjcxznios', 'metrohistory', 'gjcxznhistory', 'metroarkuix', 'gjcxznarkuix'];
  var ARKUIX_CARDS = [
    { id: 'metroandroid', alias: ARKUIX_GROUP_ALIAS, name: '轨交查询指南 Android 版', kind: 'android' },
    { id: 'metroios', alias: ARKUIX_GROUP_ALIAS, name: '轨交查询指南 iOS 版', kind: 'ios' },
    { id: 'metrohistory', alias: ARKUIX_GROUP_ALIAS, name: '轨交查询指南 ArkUI-X 历史更新公告', kind: 'ios-history' }
  ];

  // 按版本头行（如 "1.5.0.0 2026-09-23"）把更新日志切成块：第一块=最新版本（无头行），其后每块对应一个历史版本
  function splitVersionBlocks(notes) {
    var blocks = [];
    var cur = { header: '', lines: [] };
    for (var ni = 0; ni < notes.length; ni++) {
      var line = String(notes[ni]).trim();
      if (/^\d+\.\d+\.\d+\.\d+\s+\d{4}-\d{2}-\d{2}$/.test(line)) {
        if (cur.lines.length || cur.header) blocks.push(cur);
        cur = { header: line, lines: [] };
      } else {
        cur.lines.push(notes[ni]);
      }
    }
    if (cur.lines.length || cur.header) blocks.push(cur);
    return blocks;
  }

  function renderAndroidCard(v, current) {
    var html = '<div class="app-card">';
    html += '<div class="app-header">';
    html += '<img class="app-icon" src="images/metro.png" alt="轨交查询指南">';
    html += '<div class="app-info">';
    html += '<div class="app-name">轨交查询指南 Android 版</div>';
    html += '<div class="update-meta">最新版本 v' + escHtml(v.versionName)
      + (v.date ? ' · ' + escHtml(v.date) : '')
      + (v.size ? ' · ' + escHtml(v.size) : '') + '</div>';
    html += '</div></div>';
    if (current) {
      if (cmpVersion(current, v.versionName) < 0) {
        html += '<div class="update-banner">发现新版本 v' + escHtml(v.versionName) + '，当前 v' + escHtml(current) + '，建议更新</div>';
      } else {
        html += '<div class="update-banner ok">当前 v' + escHtml(current) + ' 已是最新版本</div>';
      }
    }
    if (v.notes && v.notes.length) {
      html += '<div class="app-link-label" style="margin-top:12px;">更新内容</div>';
      // Android 卡只展示最新版本的公告，历史公告统一放第三张卡片
      html += renderNotes(splitVersionBlocks(v.notes)[0] && splitVersionBlocks(v.notes)[0].lines || []);
      html += '<div class="app-links" style="margin-top:14px;">';
      html += '<a class="platform-btn" href="' + escHtml(v.apk) + '">' + ANDROID_ICON + '下载 APK</a>';
      html += '</div>';
      html += '<div class="update-meta" style="margin-top:8px;">首次安装需在系统设置中允许安装未知来源应用</div>';
    }
    html += '</div>';
    return html;
  }

  function renderIosCard(v) {
    var html = '<div class="app-card">';
    html += '<div class="app-header">';
    html += '<img class="app-icon" src="images/metro.png" alt="轨交查询指南">';
    html += '<div class="app-info">';
    html += '<div class="app-name">轨交查询指南 iOS 版</div>';
    html += '<div class="update-meta">最新版本 v' + escHtml(v.versionName) + (v.date ? ' · ' + escHtml(v.date) : '') + '</div>';
    html += '</div></div>';
    if (v.notes && v.notes.length) {
      html += '<div class="app-link-label" style="margin-top:12px;">更新内容</div>';
      // iOS 卡展示自己版本对应的更新日志（由调用方按 data.ios 选好），历史公告单独放在第三张卡片
      html += renderNotes(v.notes);
    }
    if (v.ipa) {
      html += '<div class="app-links" style="margin-top:14px;">';
      html += '<a class="platform-btn" href="' + escHtml(v.ipa) + '">' + IOS_ICON + '下载 IPA</a>';
      html += '</div>';
      html += '<div class="update-meta" style="margin-top:8px;">未上架 App Store，IPA 下载后需自行签名安装</div>';
    }
    html += '</div>';
    return html;
  }

  function renderIosHistoryCard(olderNotes) {
    if (!olderNotes.length) return '';
    var html = '<div class="app-card">';
    html += '<div class="app-header">';
    html += '<img class="app-icon" src="images/metro.png" alt="轨交查询指南">';
    html += '<div class="app-info">';
    html += '<div class="app-name">轨交查询指南 ArkUI-X 历史更新公告</div>';
    html += '<div class="update-meta">更早版本的更新内容</div>';
    html += '</div></div>';
    html += renderNotes(olderNotes);
    html += '</div>';
    return html;
  }

  function renderArkuisTab() {
    var container = document.getElementById('tabAndroid');
    var current = new URLSearchParams(window.location.search).get('v');
    fetch('update.json?t=' + Date.now())
      .then(function(r) { return r.ok ? r.json() : Promise.reject(new Error(r.status)); })
      .then(function(data) {
        var v = data && data.latest;
        if (!v || !v.versionName) return Promise.reject(new Error('bad manifest'));
        var blocks = v.notes && v.notes.length ? splitVersionBlocks(v.notes) : [];
        // iOS 版本可独立配置（data.ios.versionName 指向历史版本块），未配置或与 latest 相同时跟随 Android
        var iosInfo = {
          versionName: v.versionName,
          date: v.date,
          ipa: v.ipa,
          notes: blocks.length ? blocks[0].lines : []
        };
        var iosSkipIdx = -1;
        if (data.ios && data.ios.versionName && data.ios.versionName !== v.versionName) {
          for (var bi = 1; bi < blocks.length; bi++) {
            if (blocks[bi].header.indexOf(data.ios.versionName) === 0) {
              iosInfo.versionName = data.ios.versionName;
              iosInfo.date = data.ios.date || (blocks[bi].header.split(/\s+/)[1] || '');
              iosInfo.notes = blocks[bi].lines;
              iosSkipIdx = bi;
              break;
            }
          }
        }
        // 历史公告卡 = 除最新块和 iOS 当前块以外的所有历史版本
        var olderLines = [];
        for (var bj = 1; bj < blocks.length; bj++) {
          if (bj === iosSkipIdx) continue;
          if (olderLines.length) olderLines.push('');
          if (blocks[bj].header) olderLines.push(blocks[bj].header);
          olderLines = olderLines.concat(blocks[bj].lines);
        }
        var cards = pinApps(ARKUIX_CARDS, getAppParamKeys());
        var html = '';
        for (var i = 0; i < cards.length; i++) {
          if (cards[i].kind === 'android') html += renderAndroidCard(v, current);
          else if (cards[i].kind === 'ios') html += renderIosCard(iosInfo);
          else html += renderIosHistoryCard(olderLines);
        }
        container.innerHTML = html || '<div class="empty-tip">暂无 ArkUI-X 版本信息</div>';
      })
      .catch(function() {
        container.innerHTML = '<div class="empty-tip">暂无 ArkUI-X 版本信息</div>';
      });
  }

  var portraitBgs = ['images/Vertical.jpg', 'images/login-bg2.jpg'];
  var portraitBgsHD = ['images/showVertical.jpg', 'images/show1.jpg', 'images/show2.jpg'];
  var landscapeBgs = ['images/login-bg.jpg', 'images/Horizontal.jpg'];
  var landscapeBgsHD = ['images/showlogin-bg.jpg', 'images/show3.jpg', 'images/showHorizontal.jpg'];

  function switchBg() {
    var bg = document.getElementById('downloadBg');
    var isLandscape = window.matchMedia('(orientation: landscape)').matches;
    if (!bgUpgraded) {
      bgUpgraded = true;
      portraitBgs = portraitBgsHD;
      landscapeBgs = landscapeBgsHD;
      var collapseBtn = document.getElementById('collapseBtn');
      if (collapseBtn && document.getElementById('mainContainer').classList.contains('collapsed')) {
        document.title = 'o(\u2267\u25BD\u2266)o \u6B23\u8D4F hny \u5E05\u7167ing...';
        collapseBtn.innerHTML = '<svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 3 21 3 21 9"/><polyline points="9 21 3 21 3 15"/><line x1="21" y1="3" x2="14" y2="10"/><line x1="3" y1="21" x2="10" y2="14"/></svg> 展开';
      }
    }
    var bgs = isLandscape ? landscapeBgs : portraitBgs;
    var current = bg.style.backgroundImage || '';
    var idx = 0;
    for (var i = 0; i < bgs.length; i++) {
      if (current.indexOf(bgs[i].split('/').pop()) !== -1) { idx = i; break; }
    }
    var next = (idx + 1) % bgs.length;
    bg.style.backgroundImage = 'url(' + bgs[next] + ')';
    bg.classList.remove('alt');
  }

  function toggleCollapse() {
    var c = document.getElementById('mainContainer');
    var btn = document.getElementById('collapseBtn');
    if (c.classList.contains('collapsed')) {
      c.classList.remove('collapsed');
      document.body.classList.remove('collapsed-bg');
      btn.innerHTML = '<svg viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="4 14 10 14 10 20"/><polyline points="20 10 14 10 14 4"/><line x1="14" y1="10" x2="21" y2="3"/><line x1="3" y1="21" x2="10" y2="14"/></svg> 收起';
      document.title = 'hnyqwq 应用下载中心';
    } else {
      c.classList.add('collapsed');
      document.body.classList.add('collapsed-bg');
      if (bgUpgraded) {
        btn.innerHTML = '<svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 3 21 3 21 9"/><polyline points="9 21 3 21 3 15"/><line x1="21" y1="3" x2="14" y2="10"/><line x1="3" y1="21" x2="10" y2="14"/></svg> 展开';
      document.title = 'o(\u2267\u25BD\u2266)o \u6B23\u8D4F hny \u5E05\u7167ing...';
      } else {
        btn.innerHTML = '<svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 3 21 3 21 9"/><polyline points="9 21 3 21 3 15"/><line x1="21" y1="3" x2="14" y2="10"/><line x1="3" y1="21" x2="10" y2="14"/></svg> 展开';
        document.title = '右上角可换图/展开/切换深色';
      }
    }
  }

  function switchTheme() {
    var html = document.documentElement;
    var isDark = html.getAttribute('data-theme') === 'dark';
    var newTheme = isDark ? 'light' : 'dark';
    html.setAttribute('data-theme', newTheme);
    localStorage.setItem('theme', newTheme);
    renderApps('release');
    renderApps('beta');
    updateThemeBtn();
  }

  function updateThemeBtn() {
    var isDark = document.documentElement.getAttribute('data-theme') === 'dark';
    var btn = document.getElementById('themeBtn');
    if (btn) {
      btn.innerHTML = isDark
        ? '<svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg> 浅色'
        : '<svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg> 深色';
    }
  }

  (function(){
    var pref = localStorage.getItem('theme');
    if (pref) {
      document.documentElement.setAttribute('data-theme', pref);
    } else if (window.matchMedia('(prefers-color-scheme: dark)').matches) {
      document.documentElement.setAttribute('data-theme', 'dark');
    } else {
      document.documentElement.setAttribute('data-theme', 'light');
    }

    window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', function(e) {
      if (!localStorage.getItem('theme')) {
        document.documentElement.setAttribute('data-theme', e.matches ? 'dark' : 'light');
        renderApps('release');
        renderApps('beta');
        updateThemeBtn();
      }
    });
  })();

  var TAB_IDS = { release: 'tabRelease', beta: 'tabBeta', android: 'tabAndroid', arkuix: 'tabAndroid' };

  function activateTab(name, updateUrl) {
    if (name === 'arkuix') name = 'android'; // ?tab=arkuix 别名，兼容直达 ArkUI-X 版 Tab
    document.querySelectorAll('.tab').forEach(function(t) {
      t.classList.toggle('active', t.getAttribute('data-tab') === name);
    });
    document.querySelectorAll('.tab-content').forEach(function(c) { c.classList.remove('active'); });
    document.getElementById(TAB_IDS[name]).classList.add('active');
    if (updateUrl && window.history && history.replaceState) {
      var url = new URL(window.location.href);
      url.searchParams.set('tab', name);
      history.replaceState(null, '', url);
    }
  }

  document.querySelectorAll('.tab').forEach(function(tab) {
    tab.addEventListener('click', function() {
      activateTab(tab.getAttribute('data-tab'), true);
    });
  });

  renderApps('release');
  renderApps('beta');
  updateThemeBtn();
  renderArkuisTab();

  (function(){
    var initTab = new URLSearchParams(window.location.search).get('tab');
    if (initTab && TAB_IDS[initTab]) activateTab(initTab, false);
  })();

  (function(){
    var bg = document.getElementById('downloadBg');
    if (bg && window.matchMedia('(orientation: landscape)').matches && Math.random() < 0.5) {
      bg.classList.add('alt');
    }
  })();

  (function(){
  })();
  </script>
