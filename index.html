<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, interactive-widget=resizes-content">
  <title>星河应用下载中心 by hnyqwq</title>
  <link rel="icon" type="image/png" href="https://user.hnyqwq.cn/images/favicon.png">
  <style>
  /* HarmonyOS Sans SC - 常规 */
  @font-face {
    font-family: 'HarmonyOS Sans SC';
    src: url('https://user.hnyqwq.cn/fonts/HarmonyOS_Sans_SC_Regular.woff2') format('woff2'),
         url('https://user.hnyqwq.cn/fonts/HarmonyOS_Sans_SC_Regular.ttf') format('truetype');
    font-weight: 400;
    font-style: normal;
    font-display: swap;
  }

  /* HarmonyOS Sans SC - 粗体 */
  @font-face {
    font-family: 'HarmonyOS Sans SC';
    src: url('https://user.hnyqwq.cn/fonts/HarmonyOS_Sans_SC_Bold.woff2') format('woff2'),
         url('https://user.hnyqwq.cn/fonts/HarmonyOS_Sans_SC_Bold.ttf') format('truetype');
    font-weight: 700;
    font-style: normal;
    font-display: swap;
  }

  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  html {
    overflow-y: auto;
    height: auto;
    min-height: 100%;
  }

  body {
    font-family: 'HarmonyOS Sans SC', 'PingFang SC', 'Microsoft YaHei', -apple-system, BlinkMacSystemFont, sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    overflow-x: hidden;
  }

  .download-bg {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    background: linear-gradient(135deg, #0f0c29 0%, #302b63 50%, #24243e 100%);
    z-index: 0;
  }

  .container {
    width: 100%;
    max-width: 520px;
    padding: 20px;
    z-index: 1;
    position: relative;
  }

  .glass-card {
    background: rgba(255, 255, 255, 0.65);
    backdrop-filter: blur(20px) saturate(180%);
    -webkit-backdrop-filter: blur(20px) saturate(180%);
    border-radius: 16px;
    border: none;
    box-shadow: 0 8px 32px rgba(0, 0, 0, 0.12),
                0 2px 8px rgba(0, 0, 0, 0.08);
    overflow: hidden;
  }

  .brand-header {
    text-align: center;
    padding: 28px 30px 16px;
  }

  .brand-name {
    font-size: 26px;
    font-weight: bold;
    color: #1a1a2e;
    letter-spacing: 3px;
  }

  .brand-sub {
    display: block;
    font-size: 12px;
    color: #8c8c9a;
    margin-top: 6px;
    letter-spacing: 1px;
  }

  .tabs {
    display: flex;
    background: rgba(240, 240, 245, 0.5);
    border-bottom: 1px solid rgba(0, 0, 0, 0.06);
  }

  .tab {
    flex: 1;
    padding: 14px;
    border: none;
    background: transparent;
    cursor: pointer;
    font-size: 15px;
    color: #666;
    border-bottom: 2px solid transparent;
    transition: all 0.3s;
    font-family: inherit;
  }

  .tab:hover {
    background: rgba(255, 255, 255, 0.3);
  }

  .tab.active {
    color: #667eea;
    border-bottom-color: #667eea;
    font-weight: 600;
  }

  .tab-content {
    display: none;
    padding: 24px 30px 30px;
  }

  .tab-content.active {
    display: block;
  }

  .app-card {
    padding: 20px;
    margin-bottom: 16px;
    background: rgba(255, 255, 255, 0.45);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    border-radius: 12px;
    border: 1px solid rgba(0, 0, 0, 0.06);
    transition: all 0.3s;
  }

  .app-card:last-child {
    margin-bottom: 0;
  }

  .app-card:hover {
    background: rgba(255, 255, 255, 0.6);
    box-shadow: 0 4px 16px rgba(0, 0, 0, 0.08);
  }

  .app-header {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 14px;
  }

  .app-icon {
    font-size: 36px;
    line-height: 1;
  }

  .app-info {
    flex: 1;
  }

  .app-name {
    font-size: 17px;
    font-weight: bold;
    color: #1a1a2e;
    margin-bottom: 2px;
  }

  .app-desc {
    font-size: 13px;
    color: #8c8c9a;
  }

  .app-links {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 10px;
  }

  .platform-btn {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    padding: 10px 14px;
    border-radius: 10px;
    background: rgba(255, 255, 255, 0.5);
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.3s;
    border: 1px solid rgba(0, 0, 0, 0.08);
    color: #333;
    text-decoration: none;
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    font-family: inherit;
  }

  .platform-btn:hover {
    background: rgba(255, 255, 255, 0.75);
    transform: translateY(-1px);
    box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
  }

  .platform-btn svg {
    width: 18px;
    height: 18px;
    flex-shrink: 0;
  }

  .empty-tip {
    text-align: center;
    color: #8c8c9a;
    padding: 40px 0;
    font-size: 14px;
  }

  .site-footer {
    text-align: center;
    padding: 20px 0;
    font-size: 13px;
    color: rgba(255, 255, 255, 0.6);
    position: relative;
    z-index: 1;
    width: 100%;
  }

  .site-footer a {
    color: rgba(255, 255, 255, 0.7);
    text-decoration: none;
    transition: color 0.2s;
  }

  .site-footer a:hover {
    color: rgba(255, 255, 255, 0.95);
  }

  @media (max-width: 480px) {
    html {
      overflow-y: auto;
      height: auto;
    }

    body {
      align-items: flex-start;
      padding-top: 20px;
      padding-bottom: 40px;
      overflow-y: auto;
      overflow-x: hidden;
    }

    .container {
      padding: 10px;
      max-width: 100%;
    }

    .tab-content {
      padding: 20px;
    }

    .tab {
      padding: 12px 8px;
      font-size: 14px;
    }

    .brand-name {
      font-size: 22px;
    }

    .app-links {
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;
    }

    .platform-btn {
      padding: 10px 8px;
      font-size: 12px;
    }

    ::-webkit-scrollbar {
      width: 0;
      height: 0;
      display: none;
    }

    body {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
  }
  </style>
</head>
<body>
  <div class="download-bg"></div>
  <div class="container">
    <div class="glass-card">
      <div class="brand-header">
        <span class="brand-name">星河应用下载中心</span>
        <span class="brand-sub">by hnyqwq</span>
      </div>

      <div class="tabs">
        <button class="tab active" data-tab="release">正式版</button>
        <button class="tab" data-tab="beta">测试版</button>
      </div>

      <div id="tabRelease" class="tab-content active"></div>
      <div id="tabBeta" class="tab-content"></div>
    </div>
  </div>

  <footer class="site-footer">
    <a href="https://beian.miit.gov.cn/" target="_blank" rel="noopener noreferrer">蜀ICP备2025142744号</a>
  </footer>

  <script>
  var APPS = [
    {
      name: "示例应用 1",
      icon: "\u{1F680}",
      desc: "这是一个示例应用的描述",
      release: [
        { platform: "App Store", url: "https://apps.apple.com/", color: "#007AFF", icon: "apple" },
        { platform: "华为应用市场", url: "https://appgallery.huawei.com/", color: "#cf282a", icon: "huawei" },
        { platform: "Google Play", url: "https://play.google.com/", color: "#34A853", icon: "google" },
        { platform: "小米应用商店", url: "https://app.mi.com/", color: "#FF6900", icon: "xiaomi" }
      ],
      beta: [
        { platform: "TestFlight", url: "https://testflight.apple.com/", color: "#007AFF", icon: "apple" },
        { platform: "华为测试渠道", url: "#", color: "#cf282a", icon: "huawei" }
      ]
    },
    {
      name: "示例应用 2",
      icon: "\u{1F4F1}",
      desc: "另一个示例应用",
      release: [
        { platform: "App Store", url: "https://apps.apple.com/", color: "#007AFF", icon: "apple" },
        { platform: "华为应用市场", url: "https://appgallery.huawei.com/", color: "#cf282a", icon: "huawei" }
      ],
      beta: [
        { platform: "TestFlight", url: "https://testflight.apple.com/", color: "#007AFF", icon: "apple" }
      ]
    }
  ];

  var SVG_ICONS = {
    apple: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M18.71 19.5c-.83 1.24-1.71 2.45-3.05 2.47-1.34.03-1.77-.79-3.29-.79-1.53 0-2 .77-3.27.82-1.31.05-2.3-1.32-3.14-2.53C4.25 17 2.94 12.45 4.7 9.39c.87-1.52 2.43-2.48 4.12-2.51 1.28-.02 2.5.87 3.29.87.78 0 2.26-1.07 3.8-.91.65.03 2.47.26 3.64 1.98-.09.06-2.17 1.28-2.15 3.81.03 3.02 2.65 4.03 2.68 4.04-.03.07-.42 1.44-1.38 2.83M13 3.5c.73-.83 1.94-1.46 2.94-1.5.13 1.17-.34 2.35-1.04 3.19-.69.85-1.83 1.51-2.95 1.42-.15-1.15.41-2.35 1.05-3.11z"/></svg>',
    huawei: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M3.41 7.22C5.18 4.54 8.4 3 12 3s6.82 1.54 8.59 4.22c.22.33.11.78-.24.99L12.4 13.5c-.12.07-.26.11-.4.11s-.28-.04-.4-.11L3.65 8.21c-.35-.21-.46-.66-.24-.99zM2.1 10.6c.24-.37.75-.48 1.12-.24l7.65 4.59c.17.1.26.29.26.48v7.49c0 .45-.36.82-.8.82-.13 0-.27-.03-.39-.1C5.78 21.54 2.6 16.92 2.1 10.6zm18.68 0c-.5 6.32-3.68 10.94-7.84 13.04-.12.07-.26.1-.39.1-.44 0-.8-.37-.8-.82v-7.49c0-.19.09-.38.26-.48l7.65-4.59c.37-.24.88-.13 1.12.24z"/></svg>',
    google: '<svg viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>',
    xiaomi: '<svg viewBox="0 0 24 24" fill="#FF6900"><rect x="3" y="3" width="8" height="8" rx="1"/><rect x="13" y="3" width="8" height="8" rx="1"/><rect x="3" y="13" width="8" height="8" rx="1"/><rect x="14" y="14" width="6" height="6" rx="1"/></svg>',
    generic: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M19 9h-4V3H9v6H5l7 7 7-7zM5 18v2h14v-2H5z"/></svg>'
  };

  function renderApps(type) {
    var container = document.getElementById(type === 'release' ? 'tabRelease' : 'tabBeta');
    var hasContent = false;
    var html = '';

    for (var i = 0; i < APPS.length; i++) {
      var app = APPS[i];
      var links = type === 'release' ? app.release : app.beta;
      if (!links || links.length === 0) continue;
      hasContent = true;

      html += '<div class="app-card">';
      html += '<div class="app-header">';
      html += '<div class="app-icon">' + app.icon + '</div>';
      html += '<div class="app-info">';
      html += '<div class="app-name">' + app.name + '</div>';
      html += '<div class="app-desc">' + app.desc + '</div>';
      html += '</div>';
      html += '</div>';
      html += '<div class="app-links">';

      for (var j = 0; j < links.length; j++) {
        var link = links[j];
        var svgIcon = SVG_ICONS[link.icon] || SVG_ICONS.generic;
        var borderColor = link.color ? 'rgba(' + hexToRgb(link.color) + ',0.3)' : 'rgba(0,0,0,0.08)';
        var hoverColor = link.color ? link.color : '#333';
        html += '<a class="platform-btn" href="' + link.url + '" target="_blank" rel="noopener noreferrer" ';
        html += 'style="border-color:' + borderColor + ';color:' + (link.color || '#333') + '" ';
        html += 'onmouseenter="this.style.borderColor=\'' + hoverColor + '\';this.style.background=\'rgba(' + hexToRgb(hoverColor) + ',0.08)\'" ';
        html += 'onmouseleave="this.style.borderColor=\'' + borderColor + '\';this.style.background=\'rgba(255,255,255,0.5)\'">';
        html += svgIcon;
        html += '<span>' + link.platform + '</span>';
        html += '</a>';
      }

      html += '</div>';
      html += '</div>';
    }

    if (!hasContent) {
      html = '<div class="empty-tip">暂无' + (type === 'release' ? '正式版' : '测试版') + '应用</div>';
    }

    container.innerHTML = html;
  }

  function hexToRgb(hex) {
    var r = parseInt(hex.slice(1, 3), 16);
    var g = parseInt(hex.slice(3, 5), 16);
    var b = parseInt(hex.slice(5, 7), 16);
    return r + ',' + g + ',' + b;
  }

  document.querySelectorAll('.tab').forEach(function(tab) {
    tab.addEventListener('click', function() {
      document.querySelectorAll('.tab').forEach(function(t) { t.classList.remove('active'); });
      document.querySelectorAll('.tab-content').forEach(function(c) { c.classList.remove('active'); });
      tab.classList.add('active');
      var target = tab.getAttribute('data-tab');
      document.getElementById(target === 'release' ? 'tabRelease' : 'tabBeta').classList.add('active');
    });
  });

  renderApps('release');
  renderApps('beta');
  </script>
</body>
</html>
